<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GabouLearn : réviser tous les cours du BUT avec des fiches corrigées, des entraînements aléatoires et des cas pratiques notés.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>GabouLearn</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .hero { text-align: center; padding: 40px 0 10px; }
  .hero h1 { font-size: 2.6rem; margin: .1em 0; }
  .sem { font-size: 1.1rem; color: var(--muted); margin: 28px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .course { display: block; background: var(--card); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); color: inherit; text-decoration: none; border: 2px solid transparent; transition: border-color .15s, transform .15s; }
  .course:hover { border-color: var(--accent); transform: translateY(-2px); }
  .course .code { font-weight: 900; color: var(--accent); }
  .course .name { font-size: 1.3rem; font-weight: 800; margin: 2px 0 6px; }
  .course p { margin: 0 0 10px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .foot { text-align: center; margin-top: 40px; font-size: .9rem; }
</style>
</head>
<body>
<main class="wrap">
  <div class="hero">
    <div class="big-emoji">📚</div>
    <h1>GabouLearn</h1>
    <p class="muted">Réviser tous les cours : fiches corrigées, entraînements générés au hasard, cas pratiques notés.</p>
  </div>
  <input id="recherche" type="text" placeholder="Rechercher une matière (code, titre…)" aria-label="Rechercher une matière">
  <div id="cours"></div>
  <p class="foot muted">
    <a href="jeu/">🎮 Jeu multijoueur</a> (à lancer en local) ·
    <a href="https://github.com/IUT-Revisions/Revision" rel="noopener">Contribuer sur GitHub</a>
  </p>
</main>
<script src="assets/js/cours.js"></script>
<script src="assets/js/home.js"></script>
</body>
</html>
